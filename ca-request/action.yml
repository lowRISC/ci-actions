# NOTE.
# Requires id-token: write in the calling job to get the JWT

name: lowRISC CA request
description: Make an authenticated request to a lowRISC CA endpoint using GitHub OIDC authentication

inputs:
  audience:
    description: Intended audience for the requested JWT.
    type: string
    default: "https://ca.lowrisc.org"
  ca_api_endpoint:
    description: lowRISC CA endpoint to request a token from.
    type: string
    required: true
  ca_api_method:
    description: HTTP method to use when requesting a token from the CA endpoint.
    type: string
    default: "GET"
  body:
    description: >
      Optional JSON request body. When non-empty, sent as the request body with
      Content-Type: application/json. Ignored for GET requests by convention.
    type: string
    default: ""

runs:
  using: "composite"
  steps:
    - name: Get and exchange tokens
      id: get_token
      shell: bash
      env:
        INPUT_AUDIENCE: ${{ inputs.audience }}
        INPUT_METHOD: ${{ inputs.ca_api_method }}
        INPUT_ENDPOINT: ${{ inputs.ca_api_endpoint }}
        INPUT_BODY: ${{ inputs.body }}
      run: |
        # First, manually request a JSON Web Token (JWT) from GitHub's OIDC provider for the job (setting our CA as the intended audience)
        ID_TOKEN=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$INPUT_AUDIENCE" | jq -r .value)
        echo "::add-mask::$ID_TOKEN"

        # Build the curl command; include the request body only when one is provided
        CURL_ARGS=(-sSf -X "$INPUT_METHOD" -H "Authorization: Bearer $ID_TOKEN")
        if [[ -n "$INPUT_BODY" ]]; then
          CURL_ARGS+=(-H "Content-Type: application/json" -d "$INPUT_BODY")
        fi

        ACCESS_TOKEN=$(curl "${CURL_ARGS[@]}" "$INPUT_ENDPOINT")
        echo "::add-mask::$ACCESS_TOKEN"

        # Output the token for consumption by other steps
        echo "token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

outputs:
  token:
    description: "Token returned by the CA endpoint"
    value: ${{ steps.get_token.outputs.token }}
